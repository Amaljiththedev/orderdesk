# From the repo root:  docker compose -f infra/docker-compose.yml up --build
name: orderdesk
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: orderdesk
      POSTGRES_DB: orderdesk
    ports: ["5433:5432"]   # 5433 so it never clashes with PolicyPilot's Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderdesk"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://orderdesk:orderdesk@db:5432/orderdesk
    ports: ["8001:8000"]   # 8001 so it runs alongside PolicyPilot on 8000
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ../backend/app:/app/app   # dev: code changes apply without a rebuild
      - ../backend/tests:/app/tests
      - ../data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://orderdesk:orderdesk@db:5432/orderdesk
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ../backend/app:/app/app
      - ../data:/data
    command: python -m app.workers.worker
    restart: unless-stopped

  # mock_erp: week 3 — tiny FastAPI "ERP" with idempotency keys
  # frontend: week 4 — React + TypeScript review UI

volumes:
  pgdata:
