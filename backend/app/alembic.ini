# Run from /app inside the container:  alembic -c app/alembic.ini upgrade head
[alembic]
script_location = app/db/migrations
# put /app on the import path so env.py can import the "app" package
prepend_sys_path = .
# the database URL comes from app settings (DATABASE_URL), see env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
